services:
  cockroach:
    image: cockroachdb/cockroach:v26.2.2
    hostname: hark-cockroach
    command: start-single-node --insecure --http-addr=hark-cockroach:8081
    ports:
      - "26257:26257"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "-e", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 20
